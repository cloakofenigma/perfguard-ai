name: PerfGuard AI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'sample-app/**'  # Only trigger for application code changes
  push:
    branches: [main]
    paths:
      - 'sample-app/**'  # Only trigger for application code changes

permissions:
  contents: write  # Required for gh-pages deployment
  issues: write
  pull-requests: write

jobs:
  perfguard:
    runs-on: ubuntu-latest
    outputs:
      score: ${{ steps.run-perfguard.outputs.score }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pre-flight checks
        run: |
          echo "::group::Environment Check"
          python --version
          pip --version
          jq --version
          echo "::endgroup::"

          echo "::group::Git Status"
          git status
          git log --oneline -5
          echo "::endgroup::"

      - name: Verify API key
        run: |
          if [ -z "${{ secrets.GOOGLE_API_KEY }}" ]; then
            echo "::error::GOOGLE_API_KEY secret is not set"
            exit 1
          fi
          echo "✅ Google API key is configured"

      - name: Run linting (optional)
        continue-on-error: true
        run: |
          echo "::group::Code Quality Checks"
          ruff check perfguard/ || true
          echo "::endgroup::"

      - name: Run security scan
        continue-on-error: true
        run: |
          echo "::group::Security Scan"
          bandit -r perfguard/ -f txt || true
          echo "::endgroup::"

      - name: Run PerfGuard AI
        id: run-perfguard
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PERFGUARD_ENV: production
        run: |
          echo "::group::PerfGuard Analysis"
          python perfguard/main.py || EXIT_CODE=$?
          echo "::endgroup::"

          # Extract score for job output (handle missing file gracefully)
          if [ -f "perfguard_score.json" ]; then
            SCORE=$(jq -r '.performance_score // 0' perfguard_score.json)
            echo "score=$SCORE" >> $GITHUB_OUTPUT
            echo "📊 Performance Score: $SCORE/100"
          else
            echo "score=0" >> $GITHUB_OUTPUT
            echo "::warning::Score file not generated"
          fi

          # Preserve exit code
          exit ${EXIT_CODE:-0}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perfguard-results
          path: |
            perfguard_score.json
            perfguard_report.md
            perfguard_baselines.json
            benchmark_results.json
          retention-days: 30

      - name: Update dashboard data
        if: always()
        run: |
          # Dashboard data is automatically saved to dashboard/public/report.json by main.py
          if [ -f "dashboard/public/report.json" ]; then
            echo "✅ Dashboard data updated automatically"
          else
            echo "::warning::Dashboard report not found, creating fallback"
            # Create fallback report.json if PerfGuard didn't generate one
            mkdir -p dashboard/public
            cat > dashboard/public/report.json << 'EOF'
          {
            "performance_score": 0,
            "verdict": "ERROR",
            "metrics": {
              "execution_time": {"current": 0, "baseline": 0, "change_percent": 0, "score": 0},
              "memory_rss": {"current": 0, "baseline": 0, "change_percent": 0, "score": 0},
              "cpu_utilization": {"current": 0, "baseline": 0, "change_percent": 0, "score": 0},
              "io_latency": {"current": 0, "baseline": 0, "change_percent": 0, "score": 0},
              "complexity": {"current": 0, "baseline": 0, "change_percent": 0, "score": 0},
              "ai_risk": {"score": 0}
            },
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "error": "PerfGuard analysis did not complete. This is a fallback report."
          }
          EOF
            echo "✅ Created fallback report.json"
          fi

      - name: Set up Node.js
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        if: always()
        working-directory: ./dashboard
        run: npm install

      - name: Build dashboard
        if: always()
        working-directory: ./dashboard
        run: npm run build

      - name: Copy report to dashboard build
        if: always()
        run: |
          echo "::group::Copy Reports to Dashboard"

          # Ensure build directory exists
          mkdir -p dashboard/build

          # Copy report.json if it exists in dashboard/public/
          if [ -f "dashboard/public/report.json" ]; then
            cp dashboard/public/report.json dashboard/build/report.json
            echo "✅ Copied dashboard/public/report.json to build/"
          else
            echo "::warning::dashboard/public/report.json not found"
          fi

          # Also copy baseline_score.json if it exists
          if [ -f "dashboard/public/baseline_score.json" ]; then
            cp dashboard/public/baseline_score.json dashboard/build/baseline_score.json
            echo "✅ Copied baseline_score.json to build/"
          else
            echo "::warning::baseline_score.json not found"
          fi

          # List files in build directory for verification
          echo "Files in dashboard/build/:"
          ls -la dashboard/build/ || echo "Build directory is empty"

          echo "::endgroup::"

      - name: Deploy to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard/build
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Deploy dashboard with PerfGuard results for ${{ github.event_name }} #${{ github.event.pull_request.number || github.sha }}'

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // Check if report exists
            if (!fs.existsSync('perfguard_report.md')) {
              console.log('No report file found, skipping comment');
              return;
            }

            const report = fs.readFileSync('perfguard_report.md', 'utf8');

            // Find existing PerfGuard comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const perfguardComment = comments.find(comment =>
              comment.body.includes('PerfGuard AI Report')
            );

            // Update or create comment
            if (perfguardComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: perfguardComment.id,
                body: report
              });
              console.log('Updated existing PerfGuard comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report
              });
              console.log('Created new PerfGuard comment');
            }

      - name: Check score threshold
        if: steps.run-perfguard.outputs.score != ''
        run: |
          SCORE=${{ steps.run-perfguard.outputs.score }}
          THRESHOLD=80

          echo "Performance Score: $SCORE"
          echo "Required Threshold: $THRESHOLD"

          if (( $(echo "$SCORE < $THRESHOLD" | bc -l) )); then
            echo "::error::❌ Performance score ($SCORE) is below threshold ($THRESHOLD)"
            echo "### 🚫 Performance Check Failed" >> $GITHUB_STEP_SUMMARY
            echo "Score: **$SCORE/100** (Threshold: $THRESHOLD)" >> $GITHUB_STEP_SUMMARY
            echo "Review the PerfGuard AI report for details." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ Performance check passed!"
            echo "### ✅ Performance Check Passed" >> $GITHUB_STEP_SUMMARY
            echo "Score: **$SCORE/100**" >> $GITHUB_STEP_SUMMARY
          fi
